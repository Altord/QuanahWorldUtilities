<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Quanah World Utilities</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: two-column workbench. Left = add gear + inventory by slot. Right = sticky solved set. Stacks on phones. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunk:#e3e8f0; --fg:#1a2233; --muted:#5b6679; --line:#cfd6e2;
  --accent:#d9541e; --on-accent:#ffffff; --good:#1f8a4c; --warn:#a96a12;
  --c-dl:#7a5cf0; --c-wh:#2f9bd6; --c-reg:#1fa67a; --c-atk:#e0484d; --c-class:#c98a1b; --c-crit:#d6409f; --c-other:#8590a3;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121722; --surface:#1b2230; --sunk:#141a26; --fg:#e8ecf4; --muted:#98a3b6; --line:#2e384b;
  --accent:#ff8a4c; --on-accent:#1a1208; --good:#4cc38a; --warn:#e0b050; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1b2230; --sunk:#141a26; --fg:#e8ecf4; --muted:#98a3b6; --line:#2e384b;
  --accent:#ff8a4c; --on-accent:#1a1208; --good:#4cc38a; --warn:#e0b050; color-scheme:dark }

*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--line) 85%,var(--fg));border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);border:2px solid transparent;background-clip:padding-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header h1{font-family:var(--display);font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);max-width:65ch}
body:not(.ov-mode) header p{min-height:42px}
h2{font-family:var(--display);font-size:16px;font-weight:700;margin:0}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,400px);grid-template-areas:"add result" "inv result";align-items:start}
#add{grid-area:add} #result{grid-area:result;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)} #inv{grid-area:inv}
@media (max-width:860px){ .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"add" "result" "inv"} #result{position:static} }

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{justify-content:space-between}

.banner{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.tabs button{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:600}
.tabs button .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;margin-left:4px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button[aria-pressed="true"] .n{color:inherit;opacity:.8}

.chip{--c:var(--c-other);display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:3px 8px;font-size:12.5px;font-weight:500;white-space:nowrap;
  background:color-mix(in oklab,var(--c) 16%,var(--surface));border:1px solid color-mix(in oklab,var(--c) 50%,var(--surface))}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.chip.wasted{opacity:.5;text-decoration:line-through}
.chip.empty{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted)}
.chip.empty::before{display:none}
button.chip{padding:8px 12px;font-size:13.5px}
button.chip:disabled{opacity:.35;cursor:not-allowed}
button.chip:not(:disabled):hover{background:color-mix(in oklab,var(--c) 30%,var(--surface))}
.s-dl{--c:var(--c-dl)} .s-wh{--c:var(--c-wh)} .s-reg{--c:var(--c-reg)} .s-atk{--c:var(--c-atk)} .s-crit,.s-bd{--c:var(--c-crit)}
.s-prismatic{--c:#ff8a4c;border-image:linear-gradient(90deg,#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f) 1}
.s-prismatic::before{background:conic-gradient(#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f,#ff8a4c)}
.s-red{--c:#e0484d} .s-green{--c:#1fa67a} .s-gray{--c:#8590a3} .s-purple{--c:#7a5cf0} .s-blue{--c:#2f9bd6}
.chip.jewel::before{width:8px;height:11px;border-radius:50%;border:1.5px solid var(--c);background:color-mix(in oklab,var(--c) 35%,transparent)}
.jicon{display:inline-block;width:11px;height:14px;border-radius:50%;border:2px solid var(--c);background:color-mix(in oklab,var(--c) 35%,var(--surface));flex:none}
.jicon.s-prismatic{border-color:#ff8a4c;background:conic-gradient(#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f,#ff8a4c);box-shadow:0 0 6px rgba(255,138,76,.6)}
.jicon.wasted{opacity:.4} .jicon.need{box-shadow:0 0 0 1.5px var(--good)}
.socks{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding-left:8px;border-left:1px solid var(--line)}
.s-mage,.s-pirate,.s-thief,.s-warrior,.s-archer{--c:var(--c-class)}

.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
.ghost.danger{color:var(--c-atk);border-color:var(--c-atk)}
.btn-add{background:var(--good);border:1px solid var(--good);border-radius:6px;padding:6px 12px;color:#0b1912;font-weight:700}
.btn-add:hover:not(:disabled){filter:brightness(1.08)}
.btn-add:disabled{opacity:.35;cursor:not-allowed;background:var(--sunk);border-color:var(--line);color:var(--muted)}
.btn-dim{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 11px;color:var(--fg);font-weight:500}
.btn-dim:hover{border-color:var(--muted)}

.slots{display:grid;gap:14px 20px;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){ .slots{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:minmax(0,1fr)} }
.picker{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start}
.tabs{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tabs button{display:flex;justify-content:space-between;gap:10px;text-align:left}
.cols{display:grid;grid-template-columns:repeat(3,auto);gap:6px 12px;align-items:start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.col .chip{justify-content:flex-start}
.chip.has-icon::before{display:none}
.chip svg{width:14px;height:14px;flex:none;color:color-mix(in oklab,var(--c) 70%,var(--fg))}
.slot{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.slot-head h3{font-family:var(--display);font-size:14px;margin:0}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;border:1px solid transparent}
.item .num{font-variant-numeric:tabular-nums;color:var(--muted);width:22px;flex:none;font-weight:600}
.item .lines{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.item.picked{border-color:var(--good);background:color-mix(in oklab,var(--good) 9%,var(--surface))}
.item.picked .num{color:var(--good)}
.x{background:transparent;border:0;color:var(--muted);font-size:16px;line-height:1;padding:4px 6px;border-radius:4px;flex:none}
.x:hover{color:var(--c-atk)}
.none{color:var(--muted);padding:6px 8px}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .of{color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.ok{background:color-mix(in oklab,var(--good) 18%,var(--surface));color:var(--good)}
.pill.short{background:color-mix(in oklab,var(--warn) 18%,var(--surface));color:var(--warn)}
.pill.owned{background:color-mix(in oklab,var(--c-wh) 18%,var(--surface));color:var(--c-wh)}

.reqs{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.req{display:flex;justify-content:space-between;align-items:center;gap:8px}
.req.miss .name{color:var(--warn);font-weight:600}
.pips{display:flex;gap:3px}
.pip{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--c);background:transparent}
.pip.on{background:var(--c)}

.set{display:flex;flex-direction:column;gap:6px}
.set .item{padding:5px 0;border:0}
.set .slotname{width:68px;flex:none;font-weight:600}
.set .num{width:auto}
.hunt{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.hunt .opt{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.hunt .opt b{width:68px;flex:none}
.muted{color:var(--muted)}
#result{max-height:calc(100vh - 24px);overflow:auto}
.hunt .ghost{align-self:flex-start}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{background:transparent;border:0;border-radius:5px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tag{background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:11.5px;color:var(--muted);flex:none}
.tag[aria-pressed="true"]{border-color:var(--c-wh);color:var(--c-wh);background:color-mix(in oklab,var(--c-wh) 14%,var(--surface))}
.tag.orb[aria-pressed="true"]{border-color:var(--c-dl);color:var(--c-dl);background:color-mix(in oklab,var(--c-dl) 14%,var(--surface))}
.note-box{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.nav button{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:6px 14px;font-weight:600;font-family:var(--display)}
.nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.chk-list{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);cursor:pointer;text-align:left}
.chk.done{opacity:.65;border-color:var(--good)}
.chk.done b{text-decoration:line-through}
.chk input{margin-top:3px;accent-color:var(--good);flex:none}
.jtable{width:100%;border-collapse:collapse;font-size:13.5px}
.jtable th,.jtable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.jtable th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.jtable tr.match td{background:color-mix(in oklab,var(--good) 12%,var(--surface));font-weight:600}
.jdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.prob-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prob-pill{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--sunk);border:1px solid var(--line);color:var(--fg);cursor:help}
.prob-pill b{color:var(--accent)}
.calc-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.calc-box{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.calc-field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.calc-field input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg);font:inherit;font-size:13.5px;font-weight:600;width:100%}
.calc-field input:focus{outline:none;border-color:var(--accent)}
.calc-kpi{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;color:var(--fg)}
.calc-kpi.ok{color:var(--good)} .calc-kpi.warn{color:var(--warn)}

/* Overlay mode (?overlay=1): compact always-on-top panel drawn over the game */
body.ov-mode{background:transparent;padding:0;overflow:hidden}
.ov{background:rgba(27,34,48,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);font-size:13px;max-height:100vh;overflow-y:auto;scrollbar-gutter:stable}
.ov>*{flex-shrink:0}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:8px;-webkit-app-region:drag;cursor:move}
.ov-head h2{font-size:14px;white-space:nowrap}
.ov-head .row{-webkit-app-region:no-drag;flex-wrap:nowrap;gap:5px}
.ov-head .ghost{white-space:nowrap}
.ov .ghost{padding:4px 8px;font-size:12px}
.ov .ghost[aria-pressed="true"]{border-color:var(--good);color:var(--good);background:color-mix(in oklab,var(--good) 14%,var(--surface))}
.ov .chip{font-size:12px;padding:2px 7px} .ov button.chip{padding:5px 9px;font-size:12px}
.ov-note{color:var(--muted)} .ov-note.warn{color:var(--warn)}
.aa-tip{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11.5px;color:var(--muted);line-height:1.35}
.aa-tip b{color:var(--fg)} .aa-tip.hover{border-color:var(--accent)}
.ov-card{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.verdict{font-weight:700;font-family:var(--display)}
.verdict.yes{color:var(--good)} .verdict.no{color:var(--warn)}
.mini-tabs{display:flex;flex-wrap:wrap;gap:4px}
.mini-tabs button{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:12px}
.mini-tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ov .hunt{padding-top:8px}
.ov .hunt .opt b{width:54px}
.slot-need{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.slot-need .row{gap:4px}
/* Cursor HUD (?hud=1): compact click-through badge next to the hovered item */
.hud{display:inline-flex;flex-direction:column;gap:6px;background:rgba(20,26,38,.96);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 6px 22px rgba(0,0,0,.55);font-size:12.5px;max-width:360px}
.hud.good{border-color:var(--good)} .hud.bad{border-color:var(--warn)} .hud.owned{border-color:var(--c-wh)}
.hud.win{position:relative;border:2px solid transparent;background:linear-gradient(rgba(20,26,38,.96),rgba(20,26,38,.96)) padding-box,linear-gradient(90deg,#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f,#ff8a4c) border-box;background-size:100% 100%,200% 100%;animation:hudRainbow 1.4s linear infinite,hudPulse .9s ease-in-out infinite alternate;box-shadow:0 0 18px rgba(76,195,138,.55),0 0 34px rgba(122,92,240,.4)}
.ov.win{border:2px solid transparent;background:linear-gradient(rgba(27,34,48,.96),rgba(27,34,48,.96)) padding-box,linear-gradient(90deg,#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f,#ff8a4c) border-box;background-size:100% 100%,200% 100%;animation:hudRainbow 1.4s linear infinite;box-shadow:0 0 18px rgba(76,195,138,.45),0 0 28px rgba(122,92,240,.35)}
.pill.win{background:linear-gradient(90deg,#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f);background-size:200% 100%;animation:hudRainbow 1.4s linear infinite;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-weight:700}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;left:50%;top:50%;animation:sparkOut .95s ease-out infinite}
@keyframes hudRainbow{0%{background-position:0 0,0 0}100%{background-position:0 0,200% 0}}
@keyframes hudPulse{from{transform:scale(1)}to{transform:scale(1.03)}}
@keyframes sparkOut{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:700}
.hud-slot{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.chip.need{border-color:var(--good);box-shadow:0 0 0 1px color-mix(in oklab,var(--good) 45%,transparent)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="row spread"><h1>Quanah World Utilities</h1><nav class="nav" id="nav"></nav></div>
    <p>Quanah World 3-Line & Jewel Socket Assistant.</p>
  </header>
  <div id="tab-guide" hidden></div>
  <div id="tab-solver">
    <div id="banner"></div>
    <section class="panel" id="controls" style="margin-bottom:16px"></section>
    <div class="grid">
      <section class="panel" id="add"></section>
      <section class="panel" id="result"></section>
      <section class="panel" id="inv"></section>
    </div>
  </div>
</div>

<script src="lib/parse.js"></script>
<script>
const SLOTS = ['Hat','Top','Bottom','Cape','Glove','Shoe'];
const noDupes = lines => { const real = lines.filter(k=>k!=='other'); return new Set(real).size===real.length; };
const STATS = [
  {k:'dl',n:'Dimensional Leap',t:3},{k:'wh',n:'White Hole',t:3},{k:'reg',n:'Registry',t:3},{k:'atk',n:'ATK',t:3},
  {k:'mage',n:'Mage',t:1},{k:'pirate',n:'Pirate',t:1},{k:'thief',n:'Thief',t:1},{k:'warrior',n:'Warrior',t:1},{k:'archer',n:'Bowman',t:1},
  {k:'crit',n:'Crit DMG',t:1},{k:'bd',n:'Boss DMG',t:0}
];
const BUILDS = {
  meta: { name: 'Meta Registry', desc: '3 DL, 3 WH, 3 Reg, 3 ATK, 5 classes, 1 Crit DMG', t: {dl:3,wh:3,reg:3,atk:3,mage:1,pirate:1,thief:1,warrior:1,archer:1,crit:1,bd:0} },
  noclass: { name: 'No-Class Crit', desc: '3 DL, 3 WH, 3 Reg, 3 ATK, 3 Crit DMG (skips class skills)', t: {dl:3,wh:3,reg:3,atk:3,mage:0,pirate:0,thief:0,warrior:0,archer:0,crit:3,bd:0} },
  boss: { name: 'Boss (No-WH)', desc: '3 DL, 3 Reg, 3 ATK, 3 Boss DMG, 5 classes, 1 Crit DMG', t: {dl:3,wh:0,reg:3,atk:3,mage:1,pirate:1,thief:1,warrior:1,archer:1,crit:1,bd:3} }
};
const NAME = {other:'Other'}; const IDX = {}; const T = []; const R = []; const M = [];
let TOTAL = 0;
function applyBuild(key){
  const b = BUILDS[key] || BUILDS.meta;
  let mult = 1; TOTAL = 0;
  STATS.forEach((s,i)=>{
    s.t = b.t[s.k] || 0;
    NAME[s.k]=s.n; IDX[s.k]=i; T[i]=s.t; R[i]=s.t+1; M[i]=mult; mult*=R[i]; TOTAL += s.t;
  });
}
applyBuild('meta');

// ---------- solver: DP over capped stat counts ----------
function addLines(st, lines){
  for(const k of lines){ const i=IDX[k]; if(i===undefined) continue;
    if(Math.floor(st/M[i])%R[i] < T[i]) st += M[i]; }
  return st;
}
function digits(st){ return T.map((_,i)=>Math.floor(st/M[i])%R[i]); }
function score(st){ return digits(st).reduce((a,b)=>a+b,0); }

function runDP(items, skip){
  let cur = new Map([[0,{ways:1}]]); const layers = [];
  SLOTS.forEach((_,s)=>{
    if(s===skip) return;
    const opts = items[s].length ? items[s] : [null];
    const next = new Map();
    for(const [st,info] of cur) for(const it of opts){
      const ns = it ? addLines(st,it.lines) : st;
      const e = next.get(ns);
      if(e) e.ways += info.ways; else next.set(ns,{prev:st,item:it,slot:s,ways:info.ways});
    }
    layers.push(next); cur = next;
  });
  return layers;
}
function solve(items){

  for(const st of layers[layers.length-1].keys()){ const sc=score(st); if(sc>best){best=sc;bestSt=st;} }
  const ways = layers[layers.length-1].get(bestSt).ways;
  const picks = Array(SLOTS.length).fill(null);
  let st = bestSt;
  for(let l=layers.length-1;l>=0;l--){ const e=layers[l].get(st); picks[e.slot]=e.item; st=e.prev; }
  // which lines in the chosen set count toward the goal
  const run = T.map(()=>0);
  const used = picks.map(it => it ? it.lines.map(k=>{ const i=IDX[k]; if(i===undefined||run[i]>=T[i]) return false; run[i]++; return true; }) : []);

  const hunt = [];

    for(const st2 of ls[ls.length-1].keys()){

      d.forEach((c,i)=>{ for(let j=c;j<T[i];j++) need.push(STATS[i].k); });
      if(!noDupes(need)) continue; // a piece cannot roll the same line twice
      const key = need.join(','); if(!seen.has(key)){ seen.add(key); hunt.push({slot:s,need}); }
    }
  });

}

const JWL_LEVELS = [
  { from: 1, to: 2, req: 5, stat: '+100 Main, +100 Sec (Gray: +100 Main, +20 ATT)' },
  { from: 2, to: 3, req: 9, stat: '+150 Main, +150 Sec (Gray: +150 Main, +30 ATT)' }
];
function getDustState(){
  const d = state.dust || (state.dust = {cur:0, spareColor:0, sparePris:0, fuseTech:true});
  if(d.spareColor===undefined) d.spareColor = +d.spare||0;
  if(d.sparePris===undefined) d.sparePris = 0;
  if(d.fuseTech===undefined) d.fuseTech = true;
  return d;
}
function getJwl(){
  const j = state.jwl || (state.jwl = { dustOwned:0, curLv:1, tgtLv:2, goalLv:3, matUsed:0, matReq:5, matOwned:0, fodderType:'color', jewelColor:'', jewelLv:1, stepReqs:{1:5,2:9,3:18,4:36}, lastScanAt:0 });
  if(!j.curLv) j.curLv = 1;
  if(!j.tgtLv) j.tgtLv = j.curLv + 1;
  if(!j.goalLv || j.goalLv <= j.curLv) j.goalLv = Math.min(5, Math.max(j.curLv + 1, j.goalLv || 3));
  if(!j.stepReqs) j.stepReqs = {1:5,2:9,3:18,4:36};
  if(!j.stepReqs[3]) j.stepReqs[3] = 18;
  if(!j.stepReqs[4]) j.stepReqs[4] = 36;
  if(!j.matReq) j.matReq = j.stepReqs[j.curLv] || 0;
  if(!j.fodderType) j.fodderType = 'color';
  return j;
}
function jwlStepReq(j, lv){
  if(lv===1) return 5;
  if(lv===2) return 9;
  const def = lv===3 ? 18 : lv===4 ? 36 : 0;
  return Math.max(0, +((j.stepReqs && j.stepReqs[lv]) || (lv===j.curLv ? j.matReq : 0) || def) || 0);
}
function jwlCumulative(fromLv, toLv, j){
  let sum = 0, unknown = 0;
  for(let lv=fromLv; lv<toLv; lv++){
    const r = jwlStepReq(j, lv);
    if(r > 0) sum += r; else unknown++;
  }
  return { sum, unknown };
}
function dustCalcHtml(){
  syncItemSocketsToSockItems();
  const d = getDustState();
  const colorPer = d.fuseTech ? 225 : 125;
  const prisPer = d.fuseTech ? 850 : 750;
  const fromExtracts = (+d.spareColor||0) * colorPer + (+d.sparePris||0) * prisPer;
  const totalDust = Math.max(0, (+d.cur||0) + fromExtracts);
  const effectiveDust = Math.min(DUST_CAP, totalDust);
  const picks = bestSockPicks();
  const prismHave = picks.filter(it => it && evalSockets(it.lines).hasPrism).length;
  const score = picks.reduce((sum, it) => sum + (it ? evalSockets(it.lines).score : 0), 0);
  const statHave = score - prismHave;
  const needPrism = Math.max(0, 6 - prismHave);
  const needStat = Math.max(0, 12 - statHave);
  const dustNeeded = needPrism * 3000 + needStat * 500;
  const diff = totalDust - dustNeeded;
  const canPrism = Math.floor(effectiveDust / 3000);
  const canColor = Math.floor(effectiveDust / 500);
  const buyPrism = Math.min(needPrism, canPrism);
  const leftAfterPrism = effectiveDust - buyPrism * 3000;
  const buyStat = Math.min(needStat, Math.floor(leftAfterPrism / 500));
  const match = JEWELS.filter(j=>j.main===state.mainStat).map(j=>j.color).join(' / ');
  return `<div class="calc-grid">
    <div class="calc-box">
      <span class="label">Total Available Dust (Cap 30,000)</span>
      <div class="calc-kpi ${totalDust>DUST_CAP?'warn':''}">${totalDust.toLocaleString()} <span class="muted" style="font-size:13px;font-weight:500">/ 30,000</span></div>
      <span class="muted" style="font-size:12px">${totalDust>DUST_CAP?`<b>Over 30,000 cap by ${(totalDust-DUST_CAP).toLocaleString()}!</b> Spend Dust before extracting.`:`Craftable now: <b>${canPrism}</b> Prismatic (3,000) or <b>${canColor}</b> Colored (500)`}</span>
    </div>
    <div class="calc-box">
      <span class="label">Missing from Socket Focus (${state.mainStat})</span>
      <div class="calc-kpi">${needPrism} <span class="muted" style="font-size:13px;font-weight:500">Prismatic</span> · ${needStat} <span class="muted" style="font-size:13px;font-weight:500">${match}</span></div>
      <span class="muted" style="font-size:12px">Total Dust needed: <b>${dustNeeded.toLocaleString()}</b> (${(needPrism*3000).toLocaleString()} + ${(needStat*500).toLocaleString()})</span>
    </div>
    <div class="calc-box">
      <span class="label">Crafting Plan & Balance</span>
      <div class="calc-kpi ${diff>=0?'ok':'warn'}">${diff>=0 ? `+${diff.toLocaleString()} surplus` : `${Math.abs(diff).toLocaleString()} short`}</div>
      <span class="muted" style="font-size:12px">${dustNeeded===0 ? 'All 6 Prismatic + 12 matching sockets covered!' : `Can craft <b>${buyPrism}/${needPrism}</b> Prismatic + <b>${buyStat}/${needStat}</b> ${match} right now.`}</span>
    </div>
  </div>`;
}
function jewelLevelCalcHtml(){
  const j = getJwl(), d = getDustState();
  const colorPer = d.fuseTech ? 225 : 125, prisPer = d.fuseTech ? 850 : 750;
  const totalDust = Math.min(DUST_CAP, Math.max(0, (+d.cur||0) + (+d.spareColor||0)*colorPer + (+d.sparePris||0)*prisPer));
  const goalLv = Math.max(j.curLv + 1, Math.min(5, +j.goalLv || 3));
  const req = jwlStepReq(j, j.curLv);
  const used = req ? Math.max(0, Math.min(req, +j.matUsed||0)) : Math.max(0, +j.matUsed||0);
  const unitCost = j.fodderType==='pris' ? 3000 : 500;
  const fromOne = jwlCumulative(1, goalLv, j);
  const fromCur = jwlCumulative(j.curLv, goalLv, j);
  const remToGoal = Math.max(0, fromCur.sum - used);
  const craftDust = remToGoal * unitCost;
  const dustShort = Math.max(0, craftDust - totalDust);
  return `<div class="calc-grid">
    <div class="calc-box">
      <span class="label">Total Lv. 1 &rarr; Lv. ${goalLv}</span>
      <div class="calc-kpi">${fromOne.sum}${fromOne.unknown?'+?':''} <span class="muted" style="font-size:13px;font-weight:500">jewels</span></div>
      <span class="muted" style="font-size:12px">Remaining from Lv.${j.curLv} (${used} used): <b>${remToGoal}${fromCur.unknown?'+?':''}</b> jewels</span>
    </div>
    <div class="calc-box">
      <span class="label">Craft Cost (Remaining to Lv.${goalLv})</span>
      <div class="calc-kpi">${craftDust.toLocaleString()}${fromCur.unknown?'+?':''} <span class="muted" style="font-size:13px;font-weight:500">Dust</span></div>
      <span class="muted" style="font-size:12px">Total Lv.1&rarr;${goalLv}: <b>${(fromOne.sum*unitCost).toLocaleString()}</b> Dust (${j.fodderType==='pris'?'Prismatic':'Colored'})</span>
    </div>
    <div class="calc-box">
      <span class="label">Vs. Current Dust (${totalDust.toLocaleString()})</span>
      <div class="calc-kpi ${dustShort===0?'ok':'warn'}">${dustShort===0?'Covered by Dust':`${dustShort.toLocaleString()} Dust short`}</div>
      <span class="muted" style="font-size:12px">Need ~<b>${Math.ceil(dustShort/colorPer)}</b> trash Colored (${colorPer} ea) or <b>${Math.ceil(dustShort/prisPer)}</b> trash Pris (${prisPer} ea)</span>
    </div>
  </div>`;
}

function getDng(){
  if(!state.dng) state.dng = {};
  const d = state.dng;
  if(!d.sub) d.sub = 'glossary';
  if(typeof d.q!=='string') d.q = '';
  if(!d.files) d.files = {};
  if(!d.missions) d.missions = {};
  if(!d.buffs) d.buffs = {};
  if(!Array.isArray(d.ownedCodes)) d.ownedCodes = [];
  if(!Array.isArray(d.offeredCodes)) d.offeredCodes = [];
  if(!Array.isArray(d.customCodes)) d.customCodes = [];
  if(typeof d.weeklyPower!=='number') d.weeklyPower = 150;
  if(typeof d.weeklyMax!=='number') d.weeklyMax = 150;
  if(typeof d.drainPerRoom!=='number' || d.drainPerRoom===5) d.drainPerRoom = 1;
  if(typeof d.roomsEntered!=='number') d.roomsEntered = 0;
  return d;
}
function getAllDungeonCodes(){

}
function scoreCode(id, d){
  const owned = d.ownedCodes || [], has = x => owned.includes(x);
  const count = owned.length;
  const isFused = d.fused || (has('broken_heart') && has('creaking_limb') && has('overheated_head'));
  const hasFusionPiece = has('broken_heart') || has('creaking_limb');
  const remRooms = Math.max(1, d.weeklyPower || 20);
  if(id==='broken_heart' && !isFused && !has('broken_heart')) return {score:85, note:'Fusion 1/3 (+30% potion heal, +10% dmg taken)'};
  if(id==='creaking_limb' && !isFused && !has('creaking_limb')) return {score:82, note:'Fusion 2/3 (+20 ATT/MATT)'};
  if(id==='overheated_head'){
    if(has('broken_heart') && has('creaking_limb')) return {score:120, note:'Completes Overclocked Fusion now!'};
    return {score:-80, note:'Skip: 20% chance/floor to delete an owned code'};
  }
  if(id==='hard_reset'){
    const fdGain = count * 5;
    if(count >= 6 && !hasFusionPiece && !isFused) return {score:35 + count * 3, note:`+${fdGain}% FD (wipes ${count} non-fusion codes)`};
    return {score:-90, note:hasFusionPiece?'Skip: would wipe Overclocked Fusion pieces':`Skip: only +${fdGain}% FD for ${count} codes`};
  }
  if(id==='black_box') return (hasFusionPiece || count>=5) ? {score:-60, note:'Skip: removes 2 owned codes at random'} : {score:25, note:'+3 random, -2 owned (net +1 code)'};
  if(id==='entropy') return remRooms<=6 ? {score:45, note:`+50% FD (~${remRooms} rooms left, low Disorder risk)`} : {score:15, note:'+50% FD, but 30% Disorder/rm (~10 rms avg)'};
  if(id==='one_coin') return {score:75, note:'+30% FD (caps HP at 50%)'};
  if(id==='overclock_core') return {score:58, note:'+8/10/12% FD (+5/10/15% dmg taken)'};
  if(id==='quality_assurance') return {score:52, note:'Up to +15% FD (+3% per 10s unhit)'};
  if(id==='backspace') return {score:48, note:'10/20/30% CD reset (~15-25% skill DPS)'};
  const projPairs = [['type_w_projection','type_w_jailbreak'],['type_m_projection','type_m_jailbreak'],['type_b_projection','type_b_jailbreak'],['type_p_projection','type_p_jailbreak'],['type_t_projection','type_t_jailbreak']];
  for(const [p,j] of projPairs){
    if(id===j) return has(p) ? {score:65, note:`Synergizes with owned ${p.replace('_projection','').replace('type_','Type-').toUpperCase()} Projection (+10-30% dmg)`} : {score:22, note:'Hologram dmg +10-30% (needs matching Projection)'};
    if(id===p){
      const ownedProj = owned.find(x=>(getAllDungeonCodes().find(c=>c.id===x)||{}).projectGroup);
      if(ownedProj && ownedProj!==id) return {score:has(j)?42:12, note:`Swaps out ${ownedProj}`};
      return has(j) ? {score:68, note:`Synergizes with owned ${j.replace('_jailbreak','').replace('type_','Type-').toUpperCase()} Jailbreak`} : {score:55, note:'Enables class Hologram skill proc'};
    }
  }
  if(id==='debuggy') return {score:50, note:'1x 100% HP revive'};
  if(id==='emergency_backup') return {score:40, note:'20/30/70% HP save under 30% HP'};
  if(id==='data_compression') return {score:38, note:'+10-40% EXP'};
  if(id==='strangler_fig') return {score:36, note:'5% HP heal on kill (20/40/60%)'};
  if(id==='wild_pointer') return {score:28, note:'+50 Bytes immediately'};
  if(id==='return_protocol') return {score:22, note:'Instant safe dungeon exit'};
  const custom = (d.customCodes||[]).find(c=>c.id===id);
  if(custom) return {score:custom.estScore||30, note:custom.estNote||'Auto-catalogued program'};
  return {score:20, note:'Safe pickup'};
}
function analyzeOfferedCodes(offered, d){
  const list = [...new Set(offered||[])];
  return list.map(id => {
    const base = scoreCode(id, d);
    const owned = (d.ownedCodes||[]).includes(id);
    const adj = owned ? Math.min(base.score, 14) : base.score;
    return { id, score: adj, note: owned ? `Upgrade/duplicate (${base.note})` : base.note, owned };
  }).sort((a,b)=>b.score - a.score);
}
function recommendCode(offered, owned, fused, d){
  const ctx = d || { ownedCodes: owned||[], fused: !!fused, weeklyPower: 20, customCodes: [] };
  const ranked = analyzeOfferedCodes(offered, ctx);
  if(!ranked.length) return null;
  const top = ranked[0];
  if(top.score < 0) return { pick: null, warn: `Skip all (${top.note}) — Reroll if possible`, ranked };
  return { pick: top.id, reason: top.note, ranked };
}
function registerDiscoveredCodes(text, d){
  const lines = String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const all = getAllDungeonCodes();
  const ignore = /^(select\s*code|reroll|master\s*level|current\s*level|next\s*level|programs?|owned\s*programs?|slot\s*\d|shop|bytes|confirm|cancel|close|lv\.?\s*\d)/i;
  for(let i=0;i<lines.length-1;i++){
    if(/master\s*level|lv\.?\s*\d+\s*\/\s*\d+/i.test(lines[i+1])){
      const title = lines[i].replace(/[^a-z0-9\s\-']/gi,' ').trim();
      if(title.length < 4 || title.length > 34 || ignore.test(title)) continue;
      const already = all.some(c => [c.name,...(c.aliases||[])].some(n => n.toLowerCase() === title.toLowerCase()));
      if(already) continue;
      const snippet = lines.slice(i+1, i+4).join(' ');
      let estScore = 30, estNote = 'New program (auto-catalogued)';
      if(/final\s*damage|fd\b/i.test(snippet)){ estScore = 54; estNote = 'New FD program (auto-catalogued)'; }
      else if(/cooldown|cd\b/i.test(snippet)){ estScore = 44; estNote = 'New CD program (auto-catalogued)'; }
      else if(/\bhp\b|recover|heal/i.test(snippet)){ estScore = 35; estNote = 'New sustain program (auto-catalogued)'; }
      else if(/\bexp\b/i.test(snippet)){ estScore = 36; estNote = 'New EXP program (auto-catalogued)'; }
      const id = 'custom_' + title.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
      if(!d.customCodes.some(c=>c.id===id)){
        d.customCodes.push({ id, name: title, desc: snippet.slice(0, 140), estScore, estNote, autoAdded: true });
        all.push(d.customCodes[d.customCodes.length - 1]);
      }
    }
  }
}
function parseDungeonOcr(text, d){
  const t = String(text||'');
  const isSelect = /select\s*code|reroll/i.test(t);
  const isShop = /\bshop\b[\s\S]{0,60}\bbytes\b|special\s*sale/i.test(t);
  const isInv = /programs?\b[\s\S]{0,40}slot\s*\d+\s*\/\s*30|owned\s*programs?|program\s*inventory/i.test(t);
  if((isSelect || isInv) && d) registerDiscoveredCodes(t, d);
  const found = getAllDungeonCodes().filter(c => [c.name,...(c.aliases||[])].some(n => new RegExp(n.replace(/[-\s]+/g,'[-\\s]*'),'i').test(t))).map(c=>c.id);
  const secM = t.match(/sector\s*(\d+)\s*f\s*(\d+)/i);
  const flM = t.match(/\bfloor\s*(\d+)\b/i);
  const roomM = t.match(/\b(survive|survival|defeat\s*all\s*monsters|encounter|mushmom|extracted|gap in the grid|combat|boss)\b/i);
  const wpM = t.match(/weekly\s*projected\s*power\s*(\d+)\s*\/\s*(\d+)/i);
  const allotM = t.match(/allotment\s*card\s*x?\s*(\d+)/i);
  const buffs = [];
  if(/swift\s*attack/i.test(t)) buffs.push('Swift Attack (+1 att speed)');
  if(/quickdraw/i.test(t)) buffs.push('Quickdraw (-5% CD)');
  if(/recovery\s*marble/i.test(t)) buffs.push('Recovery Marble (10% HP orb every 3 kills)');
  const detriments = [];
  if(/divine\s*punishment|lightning\s*strikes/i.test(t)) detriments.push('Divine Punishment (Lightning)');
  if(/\bfrenzy\b/i.test(t)) detriments.push('Frenzy (Enemy speed up)');
  if(/vision\s*restriction/i.test(t)) detriments.push('Vision Restriction');
  if(/\bchaser\b/i.test(t)) detriments.push('Chaser (Enemy chases you)');
  if(/blood\s*for\s*blood/i.test(t)) detriments.push('Blood for Blood (+20% dmg >50% HP / -20% <50% HP)');
  if(/\bdisorder\b/i.test(t)) detriments.push('Disorder (3 stacks = auto-exit)');
  const encounter = /test your luck with a few bytes|bet a lot of bytes/i.test(t) ? 'Byte Gamble (sub 15 / 30 bytes)'
    : isShop ? 'Dungeon Shop (Bytes)'
    : allotM ? `Allotment Card x${allotM[1]}` : '';
  return {
    isSelect, isShop, isInv, found,
    sector: secM ? `Sector ${secM[1]} F${secM[2]}` : (flM ? `Floor ${flM[1]}` : ''),
    roomType: roomM ? (/defeat/i.test(roomM[1]) ? 'Combat' : /extracted/i.test(roomM[1]) ? 'Results' : /gap/i.test(roomM[1]) ? 'Exit' : roomM[1]) : '',
    weeklyPower: wpM ? +wpM[1] : null,
    weeklyMax: wpM ? +wpM[2] : null,
    buffs, detriments, encounter
  };
}

function evalSetSockets(picks){
  const sg = state.sockGoal || 'pris2';
  const matchColors = JEWELS.filter(j=>j.main===state.mainStat).map(j=>j.color).join(' / ');
  const pickEv = picks.map(it => it && it.sockets && it.sockets.length ? evalSockets(it.sockets) : null);
  const score = pickEv.reduce((s,ev)=>s+(ev?ev.score:0),0);
  const prismCount = pickEv.filter(ev=>ev && ev.hasPrism).length;
  const statCount = sg==='3class' ? score : (score - prismCount);
  const statTarget = sg==='3class' ? 18 : 12;
  const needSlots = SLOTS.map((s,si)=>({s,si,ev:pickEv[si]})).filter(x=>!x.ev || !x.ev.perfect);
  const done = needSlots.length===0 && score===18;
  return {sg, matchColors, pickEv, score, prismCount, statCount, statTarget, needSlots, done};
}

function fanfare(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    audio = audio || new AC(); audio.resume();
    const t0 = audio.currentTime + 0.02;
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{
      const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i*0.11, len = i===4 ? 0.9 : 0.25;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+len+0.05);
    });
    // firework pops: short bursts of filtered noise
    const n = Math.floor(audio.sampleRate*0.35), buf = audio.createBuffer(1,n,audio.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n,3);
    [0.15,0.55,0.9,1.3,1.75].forEach(dt=>{
      const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
      s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900 + Math.random()*1200; g.gain.value = 0.25;
      s.connect(f); f.connect(g); g.connect(audio.destination); s.start(t0+dt);
    });
  }catch(e){}
}
function fireworks(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100';
  document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W*dpr; c.height = H*dpr;
  const x = c.getContext('2d'); x.scale(dpr,dpr);
  const cols = ['#7a5cf0','#2f9bd6','#1fa67a','#e0484d','#f0a92b','#d6409f','#ff8a4c'];
  const BURSTS = 9; let parts = [], bursts = 0, nextAt = 0, last = performance.now(); const start = last;
  function burst(){
    const bx = W*(0.12+Math.random()*0.76), by = H*(0.12+Math.random()*0.45), col = cols[Math.floor(Math.random()*cols.length)];
    for(let i=0;i<80;i++){
      const a = Math.random()*Math.PI*2, v = 60+Math.random()*300;
      parts.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:0.55+Math.random()*0.5,col});
    }
  }
  function frame(now){
    const dt = Math.min(0.05,(now-last)/1000); last = now;
    if(bursts<BURSTS && now-start>=nextAt){ burst(); bursts++; nextAt = now-start+220+Math.random()*220; }
    x.clearRect(0,0,W,H);
    parts = parts.filter(p=>p.life>0);
    for(const p of parts){
      p.vx *= 0.985; p.vy = p.vy*0.985 + 160*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= p.decay*dt;
      x.globalAlpha = Math.max(0,p.life); x.fillStyle = p.col;
      x.beginPath(); x.arc(p.x,p.y,2.3,0,Math.PI*2); x.fill();
    }
    if(bursts<BURSTS || parts.length) requestAnimationFrame(frame); else c.remove();
  }
  requestAnimationFrame(frame);
}

function parseJewelOcr(text){
  const t = String(text || '').replace(/([0-9])[Oo]([0-9])/g,'$10$2');
  const out = { dustOwned: null, slotTotal: null, curLv: null, tgtLv: null, matUsed: null, matReq: null, matOwned: null, jewelColor: '', jewelLv: null, tooltipJewel: null };
  const invM = t.match(/INV_DUST:([^\n]+)/);
  if(invM){
    const nums = [...invM[1].matchAll(/\b(\d{1,5})\b/g)].map(m=>+m[1]).filter(n=>n>=0&&n<=DUST_CAP);
    if(nums.length) out.dustOwned = Math.max(...nums);
  }
  const slotM = t.match(/\bSLOT\s*(\d{1,3})\s*\/\s*256\b/i);
  if(slotM) out.slotTotal = Math.min(256, +slotM[1]);
  const dustM = t.match(/DUST\s*OWNED[^0-9]*(\d[\d,]*)\s*[\/\\|1Il]?\s*3[0O]{4}/i) || t.match(/(\d[\d,]*)\s*[\/\\|]\s*3[0O]{4}/i);
  if(out.dustOwned===null && dustM) out.dustOwned = Math.min(DUST_CAP, +dustM[1].replace(/,/g,''));
  const lvM = t.match(/Lv\.?\s*(\d+)\s*>{2,}\s*Lv\.?\s*(\d+)/i);
  if(lvM){ out.curLv = Math.max(1, Math.min(4, +lvM[1])); out.tgtLv = +lvM[2]; }
  const matM = t.match(/Materials\s*Used[^0-9]*(\d+)\s*\/\s*(\d+)/i) || t.match(/\b(\d+)\s*\/\s*(5|9|13|15|18|20)\b/);
  if(matM){ out.matUsed = +matM[1]; out.matReq = +matM[2]; }
  const ownM = t.match(/Materials\s*Owned[^0-9]*(\d+)/i);
  if(ownM) out.matOwned = +ownM[1];
  const ttRaw = t.includes('TT_JWL:') ? t.slice(t.indexOf('TT_JWL:') + 7) : t;
  const ttSrc = /REGISTERED\s*JEWELS|1-FUSE\s*TECH|PRISMATIC\s*\(3K\)/i.test(ttRaw) ? '' : ttRaw;
  const normLv = v => /[lI]/i.test(v) ? 1 : +v;
  const jM = ttSrc.match(/\b(Red|Blue|Green|Yellow|Gray|Prismatic)\b(?:\s*[\r\n]+\s*(?:Lv|I-?v)[.\s_]*([1-5lI])|\s+(?:Lv|I-?v)[.\s_]*([1-5lI]))?/i);
  if(jM){
    out.jewelColor = jM[1];
    out.jewelLv = (jM[2] || jM[3]) ? normLv(jM[2] || jM[3]) : null;
  }
  // Parse individual hovered jewel tooltip stats (any 2 of STR/DEX/LUK/INT/Max HP/Max MP/ATT/MATT)
  if(jM && !lvM){
    const sub = ttSrc.slice(jM.index, jM.index + 240).replace(/\bI-?IP\b/gi,'HP').replace(/\bI-?MP\b/gi,'MP');
    const stats = [];
    let infLv = out.jewelLv;
    for(const m of sub.matchAll(/\b(STR|DEX|LUK|INT|(?:Max\s*)?HP|(?:Max\s*)?MP|Magic\s*Attack|Attack\s*Power)[^\d+\r\n]{0,6}\+\s*(\d[\d \tOo]{0,6})/gi)){
      const lbl = m[1].replace(/\s+/g,' ').replace(/Attack Power/i,'ATT').replace(/Magic Attack/i,'MATT').replace(/^(HP|MP)$/i,'Max $1');
      let val = +m[2].replace(/[Oo]/g,'0').replace(/\s+/g,'');
      if(/^(ATT|MATT)$/i.test(lbl) && val>=1 && val<=4) val *= 10;
      else if(/^Max (HP|MP)$/i.test(lbl) && val < 1000) val = (infLv || 1) * 1000;
      stats.push(`${lbl} +${val}`);
      if(!infLv){
        if(/^(STR|DEX|LUK|INT)$/i.test(lbl)) infLv = ({50:1,100:2,150:3,200:4,300:5})[val] || 1;
        else if(/^(ATT|MATT)$/i.test(lbl)) infLv = ({10:1,20:2,30:3,40:4,100:5})[val] || 1;
      }
      if(stats.length>=2) break;
    }
    if(stats.length>=2) out.tooltipJewel = { color: jM[1], lv: infLv || 1, stats };
  }
  return out;
}

    if(!Array.isArray(j.scannedJewels)) j.scannedJewels = [];

  if(msg.jewelInv && msg.jewelInv.total > 0){

    } else {
      // Multi-page >64 slots: accumulate unseen scrolled rows up to slotCap (max 256)
      if(!Array.isArray(j.invSeenRows)) j.invSeenRows = [];
      const charMap = { R:'red', B:'blue', G:'green', P:'purple', X:'gray' };
      for(const row of (msg.jewelInv.rows||[])){
        if(j.inv.total >= Math.min(256, slotCap)) break;
        if(j.invSeenRows.includes(row)) continue;
        j.invSeenRows.push(row);
        for(const ch of row){
          if(ch==='.' || j.inv.total >= Math.min(256, slotCap)) continue;
          j.inv.total++;
          if(ch==='P') j.inv.prismatic++;
          else if(charMap[ch]) j.inv[charMap[ch]] = (j.inv[charMap[ch]]||0) + 1;
        }
      }
    }
    const mainCols = new Set(JEWELS.filter(x=>x.main===state.mainStat).map(x=>x.color.toLowerCase()));
    const trashCol = ['red','blue','green','purple','gray'].reduce((s,c)=>s+(mainCols.has(c)?0:(j.inv[c]||0)),0);
    d.spareColor = trashCol;
    d.sparePris = j.inv.prismatic || 0;
    hit = true;
  }
  j.scanNote = hit ? '' : (msg.trigger==='manual' ? 'No Enhance Jewel or Inventory > Jewels window found.' : j.scanNote || '');
  j.lastScanAt = msg.at;
  save(); renderJewelOverlay();

function jewelOvDustSummaryHtml(){

function jewelOvLvSummaryHtml(){

  if(msg.status==='waiting'){ state.scanStatus='waiting'; state.scanError=''; }
  else if(msg.status==='scanning'){ if(msg.manual){ state.scanStatus='scanning'; state.scanError=''; } else return; }
  else if(msg.status==='error'){ state.scanStatus=''; state.scanError='Scan failed: '+msg.error; }
  else { state.scanStatus=''; state.scanError='';
    if(!state.charClass){
      const cc = QParse.detectCharClass(msg.text);
      if(cc){ state.charClass = cc.className; state.mainStat = cc.mainStat; state.userJob = cc.job; save(); }
    }
    const p = QParse.parseTooltip(msg.text);
    if(msg.sockets) p.sockets = msg.sockets;
    if(msg.sockets && msg.sockets.includes('prismatic')) p.prismatic = true;
    if(p.lines.length || p.slot!==null || p.sockets){ lastHudHtml = ''; state.scan = p; if(OV){ attachSocketsToExisting(p); recordScan(p); if(state.autoAdd && state.autoAdd!=='off' && tryAddScanned(p, state.autoAdd)){ state.scan = null; save(); } } }
    else if(msg.manual){ state.scan = null; state.scanError = 'No hologram tooltip found near the cursor. Hover the item and try again.'; }
    else return; }
  state.huntOpen = false; render();
});

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act!=='clear') state.confirmClear = false;
  if(act==='hunt-toggle'){ state.huntOpen = !state.huntOpen; }
  else if(act==='add-sock'){
    state.pendSock.push(b.dataset.k);
    if(state.pendSock.length===3){ state.sockItems[state.active].push(mk(state.pendSock)); state.pendSock=[]; }
  }
  else if(act==='undo-sock'){ state.pendSock.pop(); }
  else if(act==='del-sock'){ const s=+b.dataset.s; state.sockItems[s]=state.sockItems[s].filter(i=>i.id!==+b.dataset.id); }
  else if(act==='clear-sock'){ state.sockItems=SLOTS.map(()=>[]); state.pendSock=[]; }
  else if(act==='ov-add-sock'){
    syncFromStorage();
    const sc = state.scan;
    if(sc && sc.slot!==null && sc.sockets && sc.sockets.length===3){
      state.sockItems[sc.slot].push(mk(sc.sockets.slice())); state.scan = null;
    }
  }
  else if(act==='tab'){ state.tab = b.dataset.t; if(BRIDGE && BRIDGE.syncTabOverlay) BRIDGE.syncTabOverlay(state.tab); }
  else if(act==='focus'){ state.focus = b.dataset.f; }
  else if(act==='sockgoal'){ state.sockGoal = b.dataset.g; }
  else if(act==='scan-reset'){ state.scanLog = []; }
  else if(act==='sock-scan-reset'){ state.sockScanLog = []; }
  else if(act==='insp'){ state.inspLv = Math.max(1, Math.min(200, (state.inspLv||1) + (+b.dataset.d))); }
  else if(act==='pfd'){ if(!state.prismFd) state.prismFd={dl:0,wh:0}; const k=b.dataset.k; state.prismFd[k] = Math.max(0, Math.min(5, (+state.prismFd[k]||0) + (+b.dataset.d))); }
  else if(act==='mapae-star'){ if(!state.mapae) state.mapae={stars:0,pot3l:false}; state.mapae.stars = Math.max(0, Math.min(22, (+state.mapae.stars||0) + (+b.dataset.d))); }
  else if(act==='mapae-3l'){ if(!state.mapae) state.mapae={stars:0,pot3l:false}; state.mapae.pot3l = b.checked; }
  else if(act==='jwl-ov-open'){ if(BRIDGE && BRIDGE.openJewelOverlay) BRIDGE.openJewelOverlay(); return; }
  else if(act==='jwl-ov-close'){ if(BRIDGE && BRIDGE.hideJewelOverlay) BRIDGE.hideJewelOverlay(); return; }
  else if(act==='jwl-ov-scan'){ if(BRIDGE && BRIDGE.scanJewel) BRIDGE.scanJewel(); return; }
  else if(act==='jwl-fuse-tech'){ const d=getDustState(); d.fuseTech = !d.fuseTech; }
  else if(act==='jwl-lv'){ const j=getJwl(); j.curLv = Math.max(1, Math.min(4, +b.dataset.lv||1)); j.tgtLv = j.curLv + 1; j.matReq = jwlStepReq(j, j.curLv); if((j.goalLv||3)<=j.curLv) j.goalLv = Math.min(5, j.curLv + 1); if(j.matReq) j.matUsed = Math.min(j.matReq, +j.matUsed||0); }
  else if(act==='jwl-goal'){ const j=getJwl(); j.goalLv = Math.max(j.curLv + 1, Math.min(5, +b.dataset.gl||3)); }
  else if(act==='jwl-inv-reset'){ const j=getJwl(); j.inv = null; j.invSeenRows = []; }
  else if(act==='jwl-tt-clear'){ const j=getJwl(); j.scannedJewels = []; j.lastTooltipSig = ''; }
  else if(act==='jwl-fcol'){ getJwl().fCol = b.dataset.c || 'all'; }
  else if(act==='jwl-fstat'){ getJwl().fStat = b.dataset.s || 'all'; }
  else if(act==='jwl-type'){ getJwl().fodderType = b.dataset.t==='pris' ? 'pris' : 'color'; }
  else if(act==='dng-sub'){ getDng().sub = b.dataset.s; }
  else if(act==='dng-file'){ const d=getDng(); d.files[b.dataset.k] = b.checked; }
  else if(act==='dng-miss'){ const d=getDng(); d.missions[b.dataset.k] = b.checked; }
  else if(act==='dng-ov-open'){ if(BRIDGE && BRIDGE.openDungeonOverlay) BRIDGE.openDungeonOverlay(); return; }
  else if(act==='open-ov'){ if(BRIDGE && BRIDGE.showOverlay) BRIDGE.showOverlay(); return; }
  else if(act==='dng-ov-close'){ if(BRIDGE && BRIDGE.hideDungeonOverlay) BRIDGE.hideDungeonOverlay(); return; }
  else if(act==='dng-ov-scan'){ if(BRIDGE && BRIDGE.scanDungeon) BRIDGE.scanDungeon(); return; }
  else if(act==='dng-buff'){ const d=getDng(); d.buffs[b.dataset.k] = !d.buffs[b.dataset.k]; }
  else if(act==='dng-room'){ const d=getDng(); d.roomsEntered=(d.roomsEntered||0)+1; d.weeklyPower=Math.max(0,(d.weeklyPower||0)-(d.drainPerRoom||1)); }
  else if(act==='dng-wp-reset'){ const d=getDng(); d.weeklyPower=d.weeklyMax||150; d.roomsEntered=0; }
  else if(act==='dng-pick'){ const d=getDng(), id=b.dataset.id, meta=DUNGEON_CODES.find(c=>c.id===id)||{}; if(meta.projectGroup){ d.ownedCodes=d.ownedCodes.filter(x=>!(DUNGEON_CODES.find(c=>c.id===x)||{}).projectGroup); } if(!d.ownedCodes.includes(id)) d.ownedCodes.push(id); d.offeredCodes=[]; if(d.ownedCodes.includes('broken_heart')&&d.ownedCodes.includes('creaking_limb')&&d.ownedCodes.includes('overheated_head')) d.fused=true; }
  else if(act==='dng-own'){ const d=getDng(), id=b.dataset.id; d.ownedCodes = d.ownedCodes.includes(id) ? d.ownedCodes.filter(x=>x!==id) : [...d.ownedCodes, id]; if(id==='overclocked') d.fused = d.ownedCodes.includes('overclocked'); }
  else if(act==='mstat'){ state.mainStat = b.dataset.s; }
  else if(act==='ujob'){ state.userJob = b.dataset.j; state.mainStat = JOBS[state.userJob].stat; }
  else if(act==='chk'){ state.checks[b.dataset.k] = b.checked; }
  else if(act==='chk-reset'){ state.checks = {}; }
  else if(act==='ov-main'){ BRIDGE.showMain(); return; }
  else if(act==='build'){ state.build = b.dataset.b; applyBuild(state.build); }
  else if(act==='ov-scan'){ BRIDGE.scan(); return; }
  else if(act==='ov-gear'){ state.gearOpen = !state.gearOpen; }
  else if(act==='ov-auto'){ state.auto = !state.auto; BRIDGE.setAuto(state.auto); }
  else if(act==='autoadd'){ state.autoAdd = b.dataset.m; }
  else if(act==='ov-close'){ BRIDGE.hideOverlay(); return; }
  else if(act==='ov-slot'){ state.scan.slot = +b.dataset.i; state.huntOpen = false; }
  else if(act==='ov-line'){ if(state.scan.lines.length<3) state.scan.lines.push(b.dataset.k); }
  else if(act==='ov-undo'){ state.scan.lines.pop(); }
  else if(act==='ov-dismiss'){ state.scan = null; state.scanError = ''; }
  else if(act==='ov-add'){
    syncFromStorage();
    const sc = state.scan;
    if(sc && sc.slot!==null && sc.lines.length===3 && noDupes(sc.lines)){
      state.items[sc.slot].push(mk(sc.lines.slice(), {sockets:sc.sockets, prismatic:sc.prismatic}));
      if(sc.sockets && sc.sockets.length===3) state.sockItems[sc.slot].push(mk(sc.sockets.slice()));
      state.example = false; state.scan = null;
    } else { state.scanError = 'A piece cannot have the same line twice. Fix the lines first.'; }
  }
  else if(act==='slot'){ state.active=+b.dataset.i; state.pending=[]; }
  else if(act==='stat'){
    if(b.dataset.k!=='other' && state.pending.includes(b.dataset.k)) return;
    state.pending.push(b.dataset.k);
    if(state.pending.length===3){ state.items[state.active].push(mk(state.pending)); state.pending=[]; state.example = state.example && false; }
  }
  else if(act==='undo'){ state.pending.pop(); }
  else if(act==='del'){ const s=+b.dataset.s; state.items[s]=state.items[s].filter(i=>i.id!==+b.dataset.id); }
  else if(act==='clear'){
    if(state.confirmClear){ state.items=SLOTS.map(()=>[]); state.pending=[]; state.example=false; state.confirmClear=false; }
    else state.confirmClear = true;
  }
  else if(act==='clear-now'){ state.items=SLOTS.map(()=>[]); state.pending=[]; state.example=false; }
  save(); render();
  const id = b.id; if(id){ const again=document.getElementById(id); if(again) again.focus({preventScroll:true}); }
});
const setAaTip = (m, hover) => {
  const el = document.getElementById('aa-tip'); if(!el) return;
  const k = m || state.autoAdd || 'off';
  el.innerHTML = `<b>${AUTO_ADD_LABEL[k]}:</b> ${getAutoAddDesc(k)}`;
  el.classList.toggle('hover', !!hover);
};
document.addEventListener('mouseover', e=>{ const b=e.target.closest('[data-act="autoadd"]'); if(b) setAaTip(b.dataset.m, true); });
document.addEventListener('mouseout', e=>{ const b=e.target.closest('[data-act="autoadd"]'); if(b && !b.contains(e.relatedTarget)) setAaTip(null, false); });
document.addEventListener('input', e=>{
  const inp = e.target.closest('[data-dust],[data-leap],[data-jwl-num],[data-jwl-q],[data-dng-q],[data-dng-num]'); if(!inp) return;
  if(inp.dataset.dust){
    const d = getDustState();
    d[inp.dataset.dust] = Math.max(0, +inp.value || 0);
    const out = document.getElementById('dust-out'); if(out) out.innerHTML = dustCalcHtml();
    const jo = document.getElementById('jwl-lv-out'); if(jo) jo.innerHTML = jewelLevelCalcHtml();
  } else if(inp.dataset.leap){
    if(!state.leap) state.leap = {cur:260, target:264};
    state.leap[inp.dataset.leap] = Math.max(1, Math.min(300, +inp.value || 1));
    const out = document.getElementById('leap-out'); if(out) out.innerHTML = leapCalcHtml();
  } else if(inp.dataset.jwlNum){
    const j = getJwl(), req = jwlReqFor(j);
    const v = Math.max(0, +inp.value || 0);
    if(inp.dataset.jwlNum==='matReq'){ j.matReq = v; if(!j.stepReqs) j.stepReqs = {1:5,2:9,3:0,4:0}; j.stepReqs[j.curLv] = v; }
    else j[inp.dataset.jwlNum] = (inp.dataset.jwlNum==='matUsed' && req) ? Math.min(req, v) : v;
    const jo = document.getElementById('jwl-lv-out'); if(jo) jo.innerHTML = jewelLevelCalcHtml();
  } else if(inp.hasAttribute('data-jwl-q')){
    const j = getJwl(); j.q = inp.value || '';
    const jl = document.getElementById('jwl-tt-list'); if(jl) jl.innerHTML = jewelScannedListHtml(j);
    const jtl = document.getElementById('jwl-tab-tt-list'); if(jtl) jtl.innerHTML = jewelScannedListHtml(j, true);
  } else if(inp.hasAttribute('data-dng-q')){
    const d = getDng(); d.q = inp.value || '';
    const gl = document.getElementById('dng-gloss'); if(gl) gl.innerHTML = dngGlossaryHtml(d.q);
  } else if(inp.dataset.dngNum){
    const d = getDng(); d[inp.dataset.dngNum] = Math.max(0, Math.min(d.weeklyMax||150, +inp.value || 0));
  }
  save();
  const jdo = document.getElementById('jwl-ov-dust-out'); if(jdo) jdo.innerHTML = jewelOvDustSummaryHtml();
  const jlo = document.getElementById('jwl-ov-lv-out'); if(jlo) jlo.innerHTML = jewelOvLvSummaryHtml();
});

if(OV || HUD || DNG || JWL){ document.body.classList.add('ov-mode'); document.documentElement.dataset.theme='dark'; document.body.innerHTML='<div id="ov-root"></div>'; }
else if(BRIDGE){ document.querySelector('header p').insertAdjacentHTML('afterend','<p>Overlay: hover an item in MapleStory and press <b>F8</b> to read it. <b>F9</b> shows or hides the overlay. Run the game in windowed or borderless mode.</p>'); }
load(); render();
</script>
