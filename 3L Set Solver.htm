<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Quanah World Utilities</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: two-column workbench. Left = add gear + inventory by slot. Right = sticky solved set. Stacks on phones. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunk:#e3e8f0; --fg:#1a2233; --muted:#5b6679; --line:#cfd6e2;
  --accent:#d9541e; --on-accent:#ffffff; --good:#1f8a4c; --warn:#a96a12;
  --c-dl:#7a5cf0; --c-wh:#2f9bd6; --c-reg:#1fa67a; --c-atk:#e0484d; --c-class:#c98a1b; --c-crit:#d6409f; --c-other:#8590a3;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121722; --surface:#1b2230; --sunk:#141a26; --fg:#e8ecf4; --muted:#98a3b6; --line:#2e384b;
  --accent:#ff8a4c; --on-accent:#1a1208; --good:#4cc38a; --warn:#e0b050; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1b2230; --sunk:#141a26; --fg:#e8ecf4; --muted:#98a3b6; --line:#2e384b;
  --accent:#ff8a4c; --on-accent:#1a1208; --good:#4cc38a; --warn:#e0b050; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header h1{font-family:var(--display);font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);max-width:65ch}
h2{font-family:var(--display);font-size:16px;font-weight:700;margin:0}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,400px);grid-template-areas:"add result" "inv result";align-items:start}
#add{grid-area:add} #result{grid-area:result;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)} #inv{grid-area:inv}
@media (max-width:860px){ .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"add" "result" "inv"} #result{position:static} }

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{justify-content:space-between}

.banner{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.tabs button{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:600}
.tabs button .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;margin-left:4px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button[aria-pressed="true"] .n{color:inherit;opacity:.8}

.chip{--c:var(--c-other);display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:3px 8px;font-size:12.5px;font-weight:500;white-space:nowrap;
  background:color-mix(in oklab,var(--c) 16%,var(--surface));border:1px solid color-mix(in oklab,var(--c) 50%,var(--surface))}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.chip.wasted{opacity:.5;text-decoration:line-through}
.chip.empty{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted)}
.chip.empty::before{display:none}
button.chip{padding:8px 12px;font-size:13.5px}
button.chip:disabled{opacity:.35;cursor:not-allowed}
button.chip:not(:disabled):hover{background:color-mix(in oklab,var(--c) 30%,var(--surface))}
.s-dl{--c:var(--c-dl)} .s-wh{--c:var(--c-wh)} .s-reg{--c:var(--c-reg)} .s-atk{--c:var(--c-atk)} .s-crit,.s-bd{--c:var(--c-crit)}
.s-prismatic{--c:#ff8a4c;border-image:linear-gradient(90deg,#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f) 1}
.s-prismatic::before{background:conic-gradient(#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f,#ff8a4c)}
.s-red{--c:#e0484d} .s-green{--c:#1fa67a} .s-gray{--c:#8590a3} .s-purple{--c:#7a5cf0} .s-blue{--c:#2f9bd6}
.chip.jewel::before{width:8px;height:11px;border-radius:50%;border:1.5px solid var(--c);background:color-mix(in oklab,var(--c) 35%,transparent)}
.jicon{display:inline-block;width:11px;height:14px;border-radius:50%;border:2px solid var(--c);background:color-mix(in oklab,var(--c) 35%,var(--surface));flex:none}
.jicon.s-prismatic{border-color:#ff8a4c;background:conic-gradient(#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f,#ff8a4c);box-shadow:0 0 6px rgba(255,138,76,.6)}
.jicon.wasted{opacity:.4} .jicon.need{box-shadow:0 0 0 1.5px var(--good)}
.socks{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding-left:8px;border-left:1px solid var(--line)}
.s-mage,.s-pirate,.s-thief,.s-warrior,.s-archer{--c:var(--c-class)}

.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
.ghost.danger{color:var(--c-atk);border-color:var(--c-atk)}
.btn-add{background:var(--good);border:1px solid var(--good);border-radius:6px;padding:6px 12px;color:#0b1912;font-weight:700}
.btn-add:hover:not(:disabled){filter:brightness(1.08)}
.btn-add:disabled{opacity:.35;cursor:not-allowed;background:var(--sunk);border-color:var(--line);color:var(--muted)}
.btn-dim{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 11px;color:var(--fg);font-weight:500}
.btn-dim:hover{border-color:var(--muted)}

.slots{display:grid;gap:14px 20px;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){ .slots{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:minmax(0,1fr)} }
.picker{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start}
.tabs{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tabs button{display:flex;justify-content:space-between;gap:10px;text-align:left}
.cols{display:grid;grid-template-columns:repeat(3,auto);gap:6px 12px;align-items:start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.col .chip{justify-content:flex-start}
.chip.has-icon::before{display:none}
.chip svg{width:14px;height:14px;flex:none;color:color-mix(in oklab,var(--c) 70%,var(--fg))}
.slot{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.slot-head h3{font-family:var(--display);font-size:14px;margin:0}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;border:1px solid transparent}
.item .num{font-variant-numeric:tabular-nums;color:var(--muted);width:22px;flex:none;font-weight:600}
.item .lines{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.item.picked{border-color:var(--good);background:color-mix(in oklab,var(--good) 9%,var(--surface))}
.item.picked .num{color:var(--good)}
.x{background:transparent;border:0;color:var(--muted);font-size:16px;line-height:1;padding:4px 6px;border-radius:4px;flex:none}
.x:hover{color:var(--c-atk)}
.none{color:var(--muted);padding:6px 8px}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .of{color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.ok{background:color-mix(in oklab,var(--good) 18%,var(--surface));color:var(--good)}
.pill.short{background:color-mix(in oklab,var(--warn) 18%,var(--surface));color:var(--warn)}

.reqs{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.req{display:flex;justify-content:space-between;align-items:center;gap:8px}
.req.miss .name{color:var(--warn);font-weight:600}
.pips{display:flex;gap:3px}
.pip{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--c);background:transparent}
.pip.on{background:var(--c)}

.set{display:flex;flex-direction:column;gap:6px}
.set .item{padding:5px 0;border:0}
.set .slotname{width:68px;flex:none;font-weight:600}
.set .num{width:auto}
.hunt{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.hunt .opt{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.hunt .opt b{width:68px;flex:none}
.muted{color:var(--muted)}
#result{max-height:calc(100vh - 24px);overflow:auto}
.hunt .ghost{align-self:flex-start}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{background:transparent;border:0;border-radius:5px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tag{background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:11.5px;color:var(--muted);flex:none}
.tag[aria-pressed="true"]{border-color:var(--c-wh);color:var(--c-wh);background:color-mix(in oklab,var(--c-wh) 14%,var(--surface))}
.tag.orb[aria-pressed="true"]{border-color:var(--c-dl);color:var(--c-dl);background:color-mix(in oklab,var(--c-dl) 14%,var(--surface))}
.note-box{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.nav button{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:6px 14px;font-weight:600;font-family:var(--display)}
.nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.chk-list{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);cursor:pointer;text-align:left}
.chk.done{opacity:.65;border-color:var(--good)}
.chk.done b{text-decoration:line-through}
.chk input{margin-top:3px;accent-color:var(--good);flex:none}
.jtable{width:100%;border-collapse:collapse;font-size:13.5px}
.jtable th,.jtable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.jtable th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.jtable tr.match td{background:color-mix(in oklab,var(--good) 12%,var(--surface));font-weight:600}
.jdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.prob-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prob-pill{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--sunk);border:1px solid var(--line);color:var(--fg);cursor:help}
.prob-pill b{color:var(--accent)}

/* Overlay mode (?overlay=1): compact always-on-top panel drawn over the game */
body.ov-mode{background:transparent;padding:0;overflow:hidden}
.ov{background:rgba(27,34,48,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);font-size:13px;max-height:100vh;overflow-y:auto}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:8px;-webkit-app-region:drag;cursor:move}
.ov-head h2{font-size:14px;white-space:nowrap}
.ov-head .row{-webkit-app-region:no-drag;flex-wrap:nowrap;gap:5px}
.ov .ghost{padding:4px 8px;font-size:12px}
.ov .ghost[aria-pressed="true"]{border-color:var(--good);color:var(--good);background:color-mix(in oklab,var(--good) 14%,var(--surface))}
.ov .chip{font-size:12px;padding:2px 7px} .ov button.chip{padding:5px 9px;font-size:12px}
.ov-note{color:var(--muted)} .ov-note.warn{color:var(--warn)}
.ov-card{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.verdict{font-weight:700;font-family:var(--display)}
.verdict.yes{color:var(--good)} .verdict.no{color:var(--warn)}
.mini-tabs{display:flex;flex-wrap:wrap;gap:4px}
.mini-tabs button{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:12px}
.mini-tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ov .hunt{padding-top:8px}
.ov .hunt .opt b{width:54px}
/* Cursor HUD (?hud=1): compact click-through badge next to the hovered item */
.hud{display:inline-flex;flex-direction:column;gap:6px;background:rgba(20,26,38,.96);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 6px 22px rgba(0,0,0,.55);font-size:12.5px;max-width:360px}
.hud.good{border-color:var(--good)} .hud.bad{border-color:var(--warn)}
.hud.win{position:relative;border:2px solid transparent;background:linear-gradient(rgba(20,26,38,.96),rgba(20,26,38,.96)) padding-box,linear-gradient(90deg,#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f,#ff8a4c) border-box;background-size:100% 100%,200% 100%;animation:hudRainbow 1.4s linear infinite,hudPulse .9s ease-in-out infinite alternate;box-shadow:0 0 18px rgba(76,195,138,.55),0 0 34px rgba(122,92,240,.4)}
.pill.win{background:linear-gradient(90deg,#ff8a4c,#f0a92b,#4cc38a,#2f9bd6,#7a5cf0,#d6409f);background-size:200% 100%;animation:hudRainbow 1.4s linear infinite;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-weight:700}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;left:50%;top:50%;animation:sparkOut .95s ease-out infinite}
@keyframes hudRainbow{0%{background-position:0 0,0 0}100%{background-position:0 0,200% 0}}
@keyframes hudPulse{from{transform:scale(1)}to{transform:scale(1.03)}}
@keyframes sparkOut{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:700}
.hud-slot{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.chip.need{border-color:var(--good);box-shadow:0 0 0 1px color-mix(in oklab,var(--good) 45%,transparent)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="row spread"><h1>Quanah World Utilities</h1><nav class="nav" id="nav"></nav></div>
    <p>Quanah World 3-Line & Jewel Socket Assistant.</p>
  </header>
  <div id="tab-guide" hidden></div>
  <div id="tab-solver">
    <div id="banner"></div>
    <section class="panel" id="controls" style="margin-bottom:16px"></section>
    <div class="grid">
      <section class="panel" id="add"></section>
      <section class="panel" id="result"></section>
      <section class="panel" id="inv"></section>
    </div>
  </div>
</div>

<script src="lib/parse.js"></script>
<script>
const SLOTS = ['Hat','Top','Bottom','Cape','Glove','Shoe'];
const noDupes = lines => { const real = lines.filter(k=>k!=='other'); return new Set(real).size===real.length; };
const STATS = [
  {k:'dl',n:'Dimensional Leap',t:3},{k:'wh',n:'White Hole',t:3},{k:'reg',n:'Registry',t:3},{k:'atk',n:'ATK',t:3},
  {k:'mage',n:'Mage',t:1},{k:'pirate',n:'Pirate',t:1},{k:'thief',n:'Thief',t:1},{k:'warrior',n:'Warrior',t:1},{k:'archer',n:'Bowman',t:1},
  {k:'crit',n:'Crit DMG',t:1},{k:'bd',n:'Boss DMG',t:0}
];
const BUILDS = {
  meta: { name: 'Meta Registry', desc: '3 DL, 3 WH, 3 Reg, 3 ATK, 5 classes, 1 Crit DMG', t: {dl:3,wh:3,reg:3,atk:3,mage:1,pirate:1,thief:1,warrior:1,archer:1,crit:1,bd:0} },
  noclass: { name: 'No-Class Crit', desc: '3 DL, 3 WH, 3 Reg, 3 ATK, 3 Crit DMG (skips class skills)', t: {dl:3,wh:3,reg:3,atk:3,mage:0,pirate:0,thief:0,warrior:0,archer:0,crit:3,bd:0} },
  boss: { name: 'Boss (No-WH)', desc: '3 DL, 3 Reg, 3 ATK, 3 Boss DMG, 5 classes, 1 Crit DMG', t: {dl:3,wh:0,reg:3,atk:3,mage:1,pirate:1,thief:1,warrior:1,archer:1,crit:1,bd:3} }
};
const NAME = {other:'Other'}; const IDX = {}; const T = []; const R = []; const M = [];
let TOTAL = 0;
function applyBuild(key){
  const b = BUILDS[key] || BUILDS.meta;
  let mult = 1; TOTAL = 0;
  STATS.forEach((s,i)=>{
    s.t = b.t[s.k] || 0;
    NAME[s.k]=s.n; IDX[s.k]=i; T[i]=s.t; R[i]=s.t+1; M[i]=mult; mult*=R[i]; TOTAL += s.t;
  });
}
applyBuild('meta');

// ---------- solver: DP over capped stat counts ----------
function addLines(st, lines){
  for(const k of lines){ const i=IDX[k]; if(i===undefined) continue;
    if(Math.floor(st/M[i])%R[i] < T[i]) st += M[i]; }
  return st;
}
function digits(st){ return T.map((_,i)=>Math.floor(st/M[i])%R[i]); }
function score(st){ return digits(st).reduce((a,b)=>a+b,0); }

function runDP(items, skip){
  let cur = new Map([[0,{ways:1}]]); const layers = [];
  SLOTS.forEach((_,s)=>{
    if(s===skip) return;
    const opts = items[s].length ? items[s] : [null];
    const next = new Map();
    for(const [st,info] of cur) for(const it of opts){
      const ns = it ? addLines(st,it.lines) : st;
      const e = next.get(ns);
      if(e) e.ways += info.ways; else next.set(ns,{prev:st,item:it,slot:s,ways:info.ways});
    }
    layers.push(next); cur = next;
  });
  return layers;
}
function solve(items){
  const layers = runDP(items,-1);
  let best=-1, bestSt=0;
  for(const st of layers[layers.length-1].keys()){ const sc=score(st); if(sc>best){best=sc;bestSt=st;} }
  const ways = layers[layers.length-1].get(bestSt).ways;
  const picks = Array(SLOTS.length).fill(null);
  let st = bestSt;
  for(let l=layers.length-1;l>=0;l--){ const e=layers[l].get(st); picks[e.slot]=e.item; st=e.prev; }
  // which lines in the chosen set count toward the goal
  const run = T.map(()=>0);
  const used = picks.map(it => it ? it.lines.map(k=>{ const i=IDX[k]; if(i===undefined||run[i]>=T[i]) return false; run[i]++; return true; }) : []);
  // one-piece-away options: for each slot, which 3 lines would finish the set
  const hunt = [];
  if(best<TOTAL) SLOTS.forEach((_,s)=>{
    const ls = runDP(items,s); const seen = new Set();
    for(const st2 of ls[ls.length-1].keys()){
      if(score(st2)!==TOTAL-3) continue;
      const d = digits(st2); const need=[];
      d.forEach((c,i)=>{ for(let j=c;j<T[i];j++) need.push(STATS[i].k); });
      if(!noDupes(need)) continue; // a piece cannot roll the same line twice
      const key = need.join(','); if(!seen.has(key)){ seen.add(key); hunt.push({slot:s,need}); }
    }
  });
  return {best, counts:digits(bestSt), picks, used, ways, hunt};
}

// ---------- state ----------
const KEY = 'threeLineSetSolver.v1';
const EXAMPLE = [
  [['dl','atk','mage'],['atk','wh','other']],
  [['wh','reg','crit'],['dl','mage','crit']],

function evalSockets(sockets){

  want.add('prismatic');
  const hits = sockets.map(c=>want.has(c));

function renderSockProbs(needSlots){

let wasDone = null, audio = null;
function celebrate(){ fireworks(); fanfare(); }
function fanfare(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    audio = audio || new AC(); audio.resume();
    const t0 = audio.currentTime + 0.02;
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{
      const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i*0.11, len = i===4 ? 0.9 : 0.25;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+len+0.05);
    });
    // firework pops: short bursts of filtered noise
    const n = Math.floor(audio.sampleRate*0.35), buf = audio.createBuffer(1,n,audio.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n,3);
    [0.15,0.55,0.9,1.3,1.75].forEach(dt=>{
      const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
      s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900 + Math.random()*1200; g.gain.value = 0.25;
      s.connect(f); f.connect(g); g.connect(audio.destination); s.start(t0+dt);
    });
  }catch(e){}
}
function fireworks(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100';
  document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W*dpr; c.height = H*dpr;
  const x = c.getContext('2d'); x.scale(dpr,dpr);
  const cols = ['#7a5cf0','#2f9bd6','#1fa67a','#e0484d','#f0a92b','#d6409f','#ff8a4c'];
  const BURSTS = 9; let parts = [], bursts = 0, nextAt = 0, last = performance.now(); const start = last;
  function burst(){
    const bx = W*(0.12+Math.random()*0.76), by = H*(0.12+Math.random()*0.45), col = cols[Math.floor(Math.random()*cols.length)];
    for(let i=0;i<80;i++){
      const a = Math.random()*Math.PI*2, v = 60+Math.random()*300;
      parts.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:0.55+Math.random()*0.5,col});
    }
  }
  function frame(now){
    const dt = Math.min(0.05,(now-last)/1000); last = now;
    if(bursts<BURSTS && now-start>=nextAt){ burst(); bursts++; nextAt = now-start+220+Math.random()*220; }
    x.clearRect(0,0,W,H);
    parts = parts.filter(p=>p.life>0);
    for(const p of parts){
      p.vx *= 0.985; p.vy = p.vy*0.985 + 160*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= p.decay*dt;
      x.globalAlpha = Math.max(0,p.life); x.fillStyle = p.col;
      x.beginPath(); x.arc(p.x,p.y,2.3,0,Math.PI*2); x.fill();
    }
    if(bursts<BURSTS || parts.length) requestAnimationFrame(frame); else c.remove();
  }
  requestAnimationFrame(frame);
}

function evalItem(sc){

  const gained = []; r.counts.forEach((c,i)=>{ for(let j=base.counts[i];j<c;j++) gained.push(STATS[i].k); });
  return {before:base.best, after:r.best, gain:r.best-base.best, gained, outsBefore:base.hunt.length, outsAfter:r.hunt.length, outsGain:r.hunt.length-base.hunt.length};
}

      const slotName = sc.slot===null ? 'item' : SLOTS[sc.slot].toLowerCase();
      card = `<div class="ov-card">
        <div class="mini-tabs">${SLOTS.map((s,i)=>`<button id="ov-slot-${i}" data-act="ov-slot" data-i="${i}" aria-pressed="${sc.slot===i}">${s}</button>`).join('')}</div>
        <div class="row">${[0,1,2].map(i=>sc.lines[i]?chip(sc.lines[i]):`<span class="chip empty">line ${i+1}</span>`).join('')}
          ${sc.lines.length?`<button class="ghost" id="ov-undo" data-act="ov-undo">Undo</button>`:''}</div>
        ${sc.lines.length<3?`<div class="ov-note warn">Read ${sc.lines.length} of 3 lines${sc.slot===null?' and no slot':''}. Fix it below.</div>
          <div class="row">${GROUPS.flat().map(k=>`<button class="chip s-${k} ${ICON[k]?'has-icon':''}" data-act="ov-line" data-k="${k}" ${k!=='other'&&sc.lines.includes(k)?'disabled':''}>${ICON[k]||''}${NAME[k]}</button>`).join('')}</div>`:''}
        ${dup ? `<div class="ov-note">Already in your ${slotName} gear.</div>` : ev ? (ev.gain>0
          ? `<div class="verdict yes">Keep it: ${ev.before} to ${ev.after} of ${TOTAL}${ev.after===TOTAL?' (set complete!)':''}${ev.outsGain>0?` (+${ev.outsGain} 1-drop outs)`:''}</div><div class="row">${ev.gained.map(k=>chip(k)).join('')}</div>`
          : ev.outsGain>0
            ? `<div class="verdict yes">Keep it: opens +${ev.outsGain} more 1-drop finish${ev.outsGain===1?'':'es'} (${ev.outsBefore}→${ev.outsAfter})</div>`
            : `<div class="verdict no">No gain for ${slotName}. Leave it.</div>`) : ''}
        ${sc.sockets?(()=>{ const se=evalSockets(sc.sockets); return `<div class="row"><span class="muted" style="font-size:11.5px">Sockets:</span>${se.sockets.map((c,i)=>sockIcon(c,se.hits[i]?'need':'wasted')).join('')}</div>`; })():''}
        <div class="row"><button class="btn-add" id="ov-add" data-act="ov-add" ${ready&&!dup?'':'disabled'}>Add to my gear (F7)</button>
          <button class="btn-dim" id="ov-dismiss" data-act="ov-dismiss">Dismiss</button></div></div>`;
    }
  }
  let hunt = '';
  if(state.focus==='sockets'){
    syncItemSocketsToSockItems();
    const picks = bestSockPicks();
    const sScore = picks.reduce((sum,it)=>sum+(it?evalSockets(it.lines).score:0),0);
    const needCnt = picks.filter(it=>!it || evalSockets(it.lines).score<3 || !evalSockets(it.lines).hasPrism).length;
    hunt = `<div class="hunt"><span class="label">Best sockets per slot (${sScore}/18)</span>
      ${needCnt?renderSockProbs(needCnt):''}
      ${SLOTS.map((s,si)=>{ const it=picks[si]; const ev=it?evalSockets(it.lines):null;
        return `<div class="opt"><b>${s}</b>${it?ev.sockets.map((c,j)=>sockChip(c,ev.hits[j]?'':'wasted')).join(''):`<span class="muted">none yet</span>`}</div>`; }).join('')}</div>`;
  } else if(!done){
    const list = res.hunt, LIMIT = 4;
    const shown = state.huntOpen ? list : list.slice(0,LIMIT);
    hunt = list.length ? `<div class="hunt"><div class="row spread"><span class="label">One drop finishes it (${list.length})</span>${list.length>LIMIT&&state.huntOpen?`<button class="ghost" data-act="hunt-toggle">Show fewer</button>`:''}</div>
      ${renderProbs(list.length)}
      ${shown.map(h=>`<div class="opt"><b>${SLOTS[h.slot]}</b>${h.need.map(k=>chip(k)).join('')}</div>`).join('')}
      ${list.length>LIMIT?`<button class="ghost" id="hunt-toggle" data-act="hunt-toggle">${state.huntOpen?'Show fewer':`Show ${list.length-LIMIT} more`}</button>`:''}</div>`
      : `<div class="hunt"><span class="label">Still missing</span><div class="opt">${missing.map(k=>chip(k)).join('')}</div></div>`;
  }
  const sockMode = state.focus==='sockets';
  const picksSock = sockMode ? bestSockPicks() : null;
  const sockScore = sockMode ? picksSock.reduce((sum,it)=>sum+(it?evalSockets(it.lines).score:0),0) : 0;
  const totalGear = (sockMode ? state.sockItems : state.items).reduce((a,b)=>a+b.length,0);
  const gearDrawer = state.gearOpen ? `<div class="hunt"><span class="label">${sockMode?'Your socket gear':'Your 3L gear'} (${totalGear})</span>
    ${SLOTS.map((s,si)=>(sockMode?state.sockItems:state.items)[si].map((it,n)=>`<div class="opt"><b>${s} #${n+1}</b>${it.lines.map(k=>sockMode?sockChip(k):chip(k)).join('')}${!sockMode&&it.sockets?`<span class="socks">${it.sockets.map(c=>sockIcon(c)).join('')}</span>`:''}
      <button class="x" data-act="${sockMode?'del-sock':'del'}" data-s="${si}" data-id="${it.id}" aria-label="Remove ${s} #${n+1}">&times;</button></div>`).join('')).join('') || `<span class="muted">No gear added yet.</span>`}</div>` : '';
  document.getElementById('ov-root').innerHTML = `<div class="ov">
    <div class="ov-head"><h2>${sockMode?`Sockets <span class="muted" style="font-weight:500">${sockScore}/18</span>`:`3L Solver <span class="muted" style="font-weight:500">${res.best}/${TOTAL}</span>`}</h2>
      <div class="row">${BRIDGE?`<button class="ghost" id="ov-auto" data-act="ov-auto" aria-pressed="${state.auto}">${state.auto?'Auto':'Manual'}</button><button class="ghost" id="ov-scan" data-act="ov-scan">Scan</button>`:''}<button class="ghost" id="ov-close" data-act="ov-close" aria-label="Hide overlay (F9)">&times;</button></div></div>
    <div class="row spread"><div class="row" style="gap:5px">${BRIDGE?`<button class="ghost" id="ov-main" data-act="ov-main">Full UI</button><button class="ghost" id="ov-gear" data-act="ov-gear" aria-pressed="${!!state.gearOpen}">Gear (${totalGear})</button>`:''}</div>
      <div class="seg"><button data-act="focus" data-f="lines" aria-pressed="${state.focus==='lines'}">3L Lines</button><button data-act="focus" data-f="sockets" aria-pressed="${state.focus==='sockets'}">Sockets</button></div></div>
    ${sockMode?'':`<div class="row spread"><span class="muted" style="font-size:11.5px">Build</span><div class="seg">${Object.entries(BUILDS).map(([k,b])=>`<button data-act="build" data-b="${k}" aria-pressed="${state.build===k}">${b.name}</button>`).join('')}</div></div>`}
    <div class="row spread"><span class="muted" style="font-size:11.5px">Class (${state.mainStat})</span><div class="seg">${Object.entries(JOBS).map(([k,j])=>`<button data-act="ujob" data-j="${k}" aria-pressed="${state.userJob===k}">${k}</button>`).join('')}</div></div>
    ${state.example?`<div class="ov-note warn">Showing example gear. Clear it in the main window.</div>`:''}
    ${card}${hunt}${gearDrawer}${done?`<div class="verdict yes">Set complete!</div>`:''}</div>`;
  if(BRIDGE) requestAnimationFrame(()=>{
    const el = document.querySelector('.ov');
    if(el) BRIDGE.resize(el.scrollHeight + 12);
  });
}
if(OV && BRIDGE && document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ const el=document.querySelector('.ov'); if(el) BRIDGE.resize(el.scrollHeight + 12); });
}
function syncFromStorage(){
  try{ const raw = JSON.parse(localStorage.getItem(KEY));
    if(raw && raw.checks && typeof raw.checks==='object') state.checks = raw.checks;
    if(raw && raw.mainStat) state.mainStat = raw.mainStat;
    if(raw && raw.userJob && JOBS[raw.userJob]) state.userJob = raw.userJob;
    if(raw && raw.charClass) state.charClass = raw.charClass;
    if(raw && raw.focus) state.focus = raw.focus;
    if(raw && typeof raw.inspLv==='number') state.inspLv = raw.inspLv;
    if(raw && Array.isArray(raw.scanLog)) state.scanLog = raw.scanLog;
    if(raw && Array.isArray(raw.sockScanLog)) state.sockScanLog = raw.sockScanLog;
    if(raw && raw.celebrated && typeof raw.celebrated==='object') state.celebrated = raw.celebrated;
    if(raw && Array.isArray(raw.sockItems) && raw.sockItems.length===SLOTS.length){
      state.sockItems = raw.sockItems.map(a=>a.map(x=>mk(x.lines||x)));
    }
    if(raw && raw.build && BUILDS[raw.build]){ state.build = raw.build; applyBuild(state.build); }
    if(raw && !raw.example && Array.isArray(raw.items) && raw.items.length===SLOTS.length){
      state.items = raw.items.map(a=>a.filter(x=>noDupes(Array.isArray(x)?x:x.lines)).map(x=>Array.isArray(x)?mk(x):mk(x.lines,x))); state.example = false;
      syncItemSocketsToSockItems();
    }
  }catch(e){}
}
addEventListener('storage', e=>{ if(e.key===KEY){ syncFromStorage(); render(); } });
if(BRIDGE) BRIDGE.onScan(msg=>{
  if(msg.status==='waiting'){ state.scanStatus='waiting'; state.scanError=''; }
  else if(msg.status==='scanning'){ if(msg.manual){ state.scanStatus='scanning'; state.scanError=''; } else return; }
  else if(msg.status==='error'){ state.scanStatus=''; state.scanError='Scan failed: '+msg.error; }
  else { state.scanStatus=''; state.scanError='';
    if(!state.charClass){
      const cc = QParse.detectCharClass(msg.text);
      if(cc){ state.charClass = cc.className; state.mainStat = cc.mainStat; state.userJob = cc.job; save(); }
    }
    const p = QParse.parseTooltip(msg.text);
    if(msg.sockets) p.sockets = msg.sockets;
    if(msg.sockets && msg.sockets.includes('prismatic')) p.prismatic = true;
    if(p.lines.length || p.slot!==null || p.sockets){ state.scan = p; if(OV){ attachSocketsToExisting(p); recordScan(p); } }
    else if(msg.manual){ state.scan = null; state.scanError = 'No hologram tooltip found near the cursor. Hover the item and try again.'; }
    else return; }
  state.huntOpen = false; render();
});

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act!=='clear') state.confirmClear = false;
  if(act==='hunt-toggle'){ state.huntOpen = !state.huntOpen; }
  else if(act==='add-sock'){
    state.pendSock.push(b.dataset.k);
    if(state.pendSock.length===3){ state.sockItems[state.active].push(mk(state.pendSock)); state.pendSock=[]; }
  }
  else if(act==='undo-sock'){ state.pendSock.pop(); }
  else if(act==='del-sock'){ const s=+b.dataset.s; state.sockItems[s]=state.sockItems[s].filter(i=>i.id!==+b.dataset.id); }
  else if(act==='clear-sock'){ state.sockItems=SLOTS.map(()=>[]); state.pendSock=[]; }
  else if(act==='ov-add-sock'){
    syncFromStorage();
    const sc = state.scan;
    if(sc && sc.slot!==null && sc.sockets && sc.sockets.length===3){
      state.sockItems[sc.slot].push(mk(sc.sockets.slice())); state.scan = null;
    }
  }
  else if(act==='tab'){ state.tab = b.dataset.t; }
  else if(act==='focus'){ state.focus = b.dataset.f; }
  else if(act==='scan-reset'){ state.scanLog = []; }
  else if(act==='sock-scan-reset'){ state.sockScanLog = []; }
  else if(act==='insp'){ state.inspLv = Math.max(1, Math.min(200, (state.inspLv||1) + (+b.dataset.d))); }
  else if(act==='mstat'){ state.mainStat = b.dataset.s; }
  else if(act==='ujob'){ state.userJob = b.dataset.j; state.mainStat = JOBS[state.userJob].stat; }
  else if(act==='chk'){ state.checks[b.dataset.k] = b.checked; }
  else if(act==='chk-reset'){ state.checks = {}; }
  else if(act==='ov-main'){ BRIDGE.showMain(); return; }
  else if(act==='build'){ state.build = b.dataset.b; applyBuild(state.build); }
  else if(act==='ov-scan'){ BRIDGE.scan(); return; }
  else if(act==='ov-gear'){ state.gearOpen = !state.gearOpen; }
  else if(act==='ov-auto'){ state.auto = !state.auto; BRIDGE.setAuto(state.auto); }
  else if(act==='ov-close'){ BRIDGE.hideOverlay(); return; }
  else if(act==='ov-slot'){ state.scan.slot = +b.dataset.i; state.huntOpen = false; }
  else if(act==='ov-line'){ if(state.scan.lines.length<3) state.scan.lines.push(b.dataset.k); }
  else if(act==='ov-undo'){ state.scan.lines.pop(); }
  else if(act==='ov-dismiss'){ state.scan = null; state.scanError = ''; }
  else if(act==='ov-add'){
    syncFromStorage();
    const sc = state.scan;
    if(sc && sc.slot!==null && sc.lines.length===3 && noDupes(sc.lines)){
      state.items[sc.slot].push(mk(sc.lines.slice(), {sockets:sc.sockets, prismatic:sc.prismatic}));
      if(sc.sockets && sc.sockets.length===3) state.sockItems[sc.slot].push(mk(sc.sockets.slice()));
      state.example = false; state.scan = null;
    } else { state.scanError = 'A piece cannot have the same line twice. Fix the lines first.'; }
  }
  else if(act==='slot'){ state.active=+b.dataset.i; state.pending=[]; }
  else if(act==='stat'){
    if(b.dataset.k!=='other' && state.pending.includes(b.dataset.k)) return;
    state.pending.push(b.dataset.k);
    if(state.pending.length===3){ state.items[state.active].push(mk(state.pending)); state.pending=[]; state.example = state.example && false; }
  }
  else if(act==='undo'){ state.pending.pop(); }
  else if(act==='del'){ const s=+b.dataset.s; state.items[s]=state.items[s].filter(i=>i.id!==+b.dataset.id); }
  else if(act==='clear'){
    if(state.confirmClear){ state.items=SLOTS.map(()=>[]); state.pending=[]; state.example=false; state.confirmClear=false; }
    else state.confirmClear = true;
  }
  else if(act==='clear-now'){ state.items=SLOTS.map(()=>[]); state.pending=[]; state.example=false; }
  save(); render();
  const id = b.id; if(id){ const again=document.getElementById(id); if(again) again.focus({preventScroll:true}); }
});

if(OV || HUD){ document.body.classList.add('ov-mode'); document.documentElement.dataset.theme='dark'; document.body.innerHTML='<div id="ov-root"></div>'; }
else if(BRIDGE){ document.querySelector('header p').insertAdjacentHTML('afterend','<p>Overlay: hover an item in MapleStory and press <b>F8</b> to read it. <b>F9</b> shows or hides the overlay. Run the game in windowed or borderless mode.</p>'); }
load(); render();
</script>
</body>
